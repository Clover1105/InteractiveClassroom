prompt: |
  你是一名记忆抽取器。从下面这一轮师生对话中，抽取"值得长期记住的、关于学生本人的事实"。

  只抽取满足以下条件的内容：
  1. 学生自述的身份、背景、技术栈、年级、职业（如"我是Python后端开发"）
  2. 学生明确表达的偏好或习惯（如"我不喜欢公式推导""偏好简洁回答"）
  3. 学生提到的、跨对话仍然有效的目标或约束（如"我在准备考研"）

  不抽取：课程知识点本身、本轮临时性的疑问、AI 的回答内容。

  学生提问：$question
  助手回答：$answer

  严格输出 JSON 数组（字符串列表），没有值得记的就输出 []
  示例：["学生是 Python 后端开发", "学生偏好简洁务实的回答"]
  只输出 JSON 数组本身，不要任何额外文字。
